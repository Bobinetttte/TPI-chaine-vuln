<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/base.css">
    <link rel="stylesheet" href="styles/one-cve.css">
    <script type="module" src="scripts/cve/one-cve.js"></script>
    <title>CVE</title>
</head>

<body>

    <div id="menu">

        <div id="nav-header">
            <img id="logo" src="img/logos/logoChainCVE.png" alt="Logo du TPI">

            <nav>
                <ul>
                    <li>
                        <a href="index.html">
                            <img title="Associaitons" class="icons" src="img/icons/home.png" alt="Maison">
                        </a>
                    </li>
                    <li>
                        <a href="chainage.html">
                            <img title="Chaînages" class="icons" src="img/icons/chain.png" alt="Chaine simple">
                        </a>
                    </li>
                    <li>
                        <a href="cve-list.html">
                            <img title="CVE" class="icons" src="img/icons/bug.png" alt="Insecte">
                        </a>
                    </li>
                </ul>
            </nav>
        </div>

        <div id="nav-footer">
            <p>TPI&copy; - Kalvin Baitan - 2026</p>
        </div>

    </div>

    <main>
        <div id="title">
            <h1>CVE</h1>
            <h2>CVE</h2>
        </div>

        <div id="data">

            <div id="infos">
                <div>
                    <p class="mini-title">Vendeur</p>
                    <p id="cve-softwareName-version"></p>
                </div>

                <div>
                    <p class="mini-title">Dernière date de modification</p>
                    <p id="cve-lastModified"></p>
                </div>

                <div>
                    <p class="mini-title">Date de publication</p>
                    <p id="cve-published"></p>
                </div>

                <div>
                    <p class="mini-title">Status</p>
                    <p id="cve-status"></p>
                </div>

            </div>

            <div id="metrics">
                <div>
                    <p class="mini-title">Base score</p>
                    <p id="cve-baseScore"></p>
                </div>
                <div>
                    <p class="mini-title">Exploitability score</p>
                    <p id="cve-exploitabilityScore"></p>
                </div>
                <div>
                    <p class="mini-title">Impact score</p>
                    <p id="cve-impactScore"></p>
                </div>
            </div>

            <div id="description">
                <p class="mini-title">Description</p>
                <p id="cve-description"></p>
            </div>


        </div>
    </main>

</body>
