services:
  traefik:
    image: "traefik:v2.0.0-rc3"
    container_name: "traefik"
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80" 
    ports:
      - "80:80"
      - "8082:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"

  backend:
    build: ./backend
    container_name: backend
    volumes:
      - ./backend/:/var/www/html
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`backend.local`)"
      - "traefik.http.routers.backend.entrypoints=web"
      - "traefik.http.services.backend.loadbalancer.server.port=80"

  frontend:
    build: ./frontend
    container_name: frontend
    volumes:
      - ./frontend:/usr/local/apache2/htdocs
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`frontend.local`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"

  db:
    image: mariadb:10.11
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: notSecureChangeMe
      MYSQL_DATABASE: chain-cve
      MYSQL_USER: chain-cve-user
      MYSQL_PASSWORD: password
    volumes:
      - ./db/mysql:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

  phpmyadmin:
    image: phpmyadmin
    restart: always

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.db.rule=Host(`db.local`)"
      - "traefik.http.routers.db.entrypoints=web"
      - "traefik.http.services.db.loadbalancer.server.port=80"

    environment:
      - PMA_ARBITRARY=1
